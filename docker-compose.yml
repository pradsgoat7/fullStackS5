# CampusEats — full stack in Docker: MongoDB + Express API + React app (nginx)
# Start:  docker compose up -d --build      App: http://localhost:8080
# Stop:   docker compose down               (add -v to also delete the database volume)
name: campuseats

services:
  mongo:
    image: mongo:8
    container_name: campuseats-mongo
    restart: unless-stopped
    # Not published to the host: only the backend can reach the database
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    image: campuseats-backend
    container_name: campuseats-backend
    restart: unless-stopped
    # Secrets (JWT_SECRET, ADMIN_*) are read at runtime and never baked into the image
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/campuseats
      CLIENT_URL: http://localhost:8080
      TRUST_PROXY: 1
    ports:
      - "5050:5000" # host port 5000 is used by macOS AirPlay Receiver
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: campuseats-frontend
    container_name: campuseats-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
