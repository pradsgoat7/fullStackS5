# Render Blueprint for the CampusEats API (Dashboard → New → Blueprint → pick this repo).
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: campuseats-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /
    # Deploy only after the GitHub Actions checks for the commit have passed
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGO_URI # MongoDB Atlas connection string
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: CLIENT_URL # the Vercel frontend URL, e.g. https://campuseats.vercel.app
        sync: false
      - key: TRUST_PROXY
        value: "1"
